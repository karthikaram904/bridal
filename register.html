<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="img/favicon.png" rel="icon">
<title>Bridal Fashion Designer</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI',sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#BF9456,#8C6A3A);
  padding:20px 0;
}

.container{
  background:#fff;
  width:100%;
  max-width:420px;
  padding:40px 30px;
  border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.logo{
  text-align:center;
  margin-bottom:15px;
}

.logo img{
  width:180px;
}

h2{
  text-align:center;
  margin-bottom:25px;
  color:#333;
}

.input-group{
  margin-bottom:15px;
}

.input-group input{
  width:100%;
  padding:12px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:14px;
  transition:0.3s;
}

.input-group input:focus{
  border-color:#BF9456;
  outline:none;
}

.password-group {
  position: relative;
  margin-bottom:15px;
}

.password-group input {
  width: 100%;
  padding:12px;
  padding-right: 40px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:14px;
  transition:0.3s;
}

.password-group input:focus{
  border-color:#BF9456;
  outline:none;
}

.eye-icon {
  position: absolute;
  right:12px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  color: #777;
  font-size:16px;
  user-select:none;
}

.eye-icon:hover {
  color: #000;
}

.remember-forgot{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
  font-size:13px;
}

.remember-me{
  display:flex;
  align-items:center;
  gap:6px;
  color:#555;
  cursor:pointer;
}

.remember-me input[type="checkbox"]{
  width:15px;
  height:15px;
  accent-color:#BF9456;
  cursor:pointer;
}

.forgot-link{
  color:#BF9456;
  text-decoration:none;
  font-weight:600;
}

.forgot-link:hover{
  text-decoration:underline;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#BF9456;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

button:hover{
  background:#a87c3f;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:20px 0;
  color:#aaa;
  font-size:13px;
}

.divider::before,
.divider::after{
  content:'';
  flex:1;
  height:1px;
  background:#e0e0e0;
}

.social-buttons{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.social-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  width:100%;
  padding:11px;
  border-radius:8px;
  font-size:14px;
  font-weight:600;
  cursor:pointer;
  transition:0.3s;
  text-decoration:none;
}

.google-btn{
  background:#fff;
  border:1px solid #ddd;
  color:#333;
}

.google-btn:hover{
  background:#f5f5f5;
  border-color:#bbb;
}

.apple-btn{
  background:#000;
  border:1px solid #000;
  color:#fff;
}

.apple-btn:hover{
  background:#222;
}

.social-btn svg{
  flex-shrink:0;
}

.switch{
  text-align:center;
  margin-top:18px;
  font-size:14px;
}

.switch a{
  color:#BF9456;
  text-decoration:none;
  font-weight:600;
}

@media(max-width:480px){
  .container{
    margin:20px;
    padding:30px 20px;
  }
}
</style>

</head>
<body>

<div class="container">

  <div class="logo">
    <a href="index.html"><img src="img/bridal-logo.png"></a>
  </div>

  <h2>Create Account</h2>

  <form>
    <div class="input-group">
      <input type="text" placeholder="Full Name" required>
    </div>

    <div class="input-group">
      <input type="email" placeholder="Email Address" required>
    </div>

    <div class="password-group">
      <input type="password" id="password" placeholder="Password" required>
      <span id="togglePassword" class="eye-icon">👁️</span>
    </div>

    <div class="password-group">
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
      <span id="toggleConfirm" class="eye-icon">👁️</span>
    </div>

    <div class="remember-forgot">
      <label class="remember-me">
        <input type="checkbox" name="remember">
        Remember me
      </label>
      <a href="#" class="forgot-link">Forgot Password?</a>
    </div>

    <button type="submit">Register</button>
  </form>

  <div class="switch">
    Already have an account? <a href="login.html">Login</a>
  </div>

  <div class="divider">Or sign up with</div>

  <div class="social-buttons">
    <a href="#" class="social-btn google-btn">
      <svg width="18" height="18" viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>

    <a href="#" class="social-btn apple-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
      </svg>
      Continue with Apple
    </a>
  </div>

</div>

<script>
  const togglePassword = document.getElementById("togglePassword");
  const password = document.getElementById("password");
  togglePassword.addEventListener("click", () => {
    const type = password.type === "password" ? "text" : "password";
    password.type = type;
    togglePassword.textContent = type === "password" ? "👁️" : "🙈";
  });

  const toggleConfirm = document.getElementById("toggleConfirm");
  const confirmPassword = document.getElementById("confirmPassword");
  toggleConfirm.addEventListener("click", () => {
    const type = confirmPassword.type === "password" ? "text" : "password";
    confirmPassword.type = type;
    toggleConfirm.textContent = type === "password" ? "👁️" : "🙈";
  });
</script>
</body>
</html>
